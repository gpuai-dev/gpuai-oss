name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gpuai
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gpuai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gpuai -d gpuai_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_TEST_URL: postgres://gpuai:ci-only-password@localhost:5432/gpuai_test?sslmode=disable
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal examples openapi)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - name: Migrate the test database
        run: go run ./cmd/gpuctl migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_TEST_URL }}
          REDIS_URL: ${{ env.REDIS_TEST_URL }}
      - run: go test -count=1 ./...

  sdk:
    name: SDK tests (Python and TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install .
          python -m pytest -q
      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm test

  mcp:
    name: MCP server test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mcp/package-lock.json
            sdk/typescript/package-lock.json
      - working-directory: mcp
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

  scan:
    name: Secret and forbidden-string scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Forbidden strings
        run: scripts/check-forbidden.sh
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: gitleaks (full history)
        run: /tmp/gitleaks git --redact --verbose --log-opts="--all" .

  e2e:
    name: Quickstart end to end (mock supplier)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Provision and terminate through the generic adapter
        run: E2E_DOWN=1 scripts/e2e.sh
