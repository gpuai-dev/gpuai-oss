[project]
name = "gpuai-sdk"
version = "0.1.0"
description = "Python SDK for the GPU.ai Open Source API"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["OpenAPI", "OpenAPI-Generator", "GPU.ai Open Source API"]
# The generator emits an end-of-life 3.9 floor that contradicts its own
# setup.py; this file is protected by .openapi-generator-ignore.
requires-python = ">=3.10"

dependencies = [
  "urllib3 (>=2.6.3,<3.0.0)",
  "python-dateutil (>=2.8.2)",
  "pydantic (>=2.11)",
  "typing-extensions (>=4.7.1)",
]

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">= 8.4.2"
pytest-cov = ">= 2.8.1"
tox = ">= 3.9.0"
flake8 = ">= 4.0.0"
types-python-dateutil = ">= 2.8.19.14"
mypy = ">= 1.5"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
  "gpuai_sdk",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
